[project]
name = "compute-cot"
version = "0.1.0"
description = "Programmatic, verifiable, difficulty-controlled math SFT data generator with data lineage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
]

[project.scripts]
mathgen = "mathgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathgen"]

# Keep the environment and cache inside the project directory (see AGENTS.md).
[tool.uv]
# (cache dir is set via UV_CACHE_DIR=.uv_cache in the project, see uv.env / Makefile)
